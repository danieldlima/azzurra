<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Azzurra Capital | Manutencao</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-start: #242e63;
        --bg-end: #0f1337;
        --panel: rgba(255, 255, 255, 0.1);
        --panel-border: rgba(255, 255, 255, 0.1);
        --text: #ffffff;
        --muted: #f1f2f2;
        --accent: #ddca96;
        --shadow: 0px 11px 30px 0px rgb(78 119 141 / 42%);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Tajawal, Arial, sans-serif;
        background: linear-gradient(116deg, var(--bg-start) 0%, #38617a 100%);
        color: var(--text);
      }

      .shell {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 64px 24px;
      }

      .panel {
        width: min(1152px, 100%);
        border: 1px solid var(--panel-border);
        border-radius: 32px;
        background: var(--panel);
        box-shadow: var(--shadow);
        backdrop-filter: blur(12px);
        overflow: hidden;
      }

      .panel-inner {
        padding: 40px 24px;
      }

      .content {
        width: min(768px, 100%);
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .brand {
        width: 208px;
        margin-bottom: 40px;
        color: #ffffff;
      }

      .brand svg {
        display: block;
        width: 100%;
        height: auto;
      }

      .eyebrow {
        margin: 0 0 16px;
        color: var(--accent);
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.35em;
        line-height: 1;
        text-transform: uppercase;
      }

      h1 {
        max-width: 576px;
        margin: 0;
        color: var(--text);
        font-size: clamp(2.25rem, 5vw, 3.75rem);
        font-weight: 300;
        line-height: 1.1;
      }

      .description {
        max-width: 672px;
        margin: 24px 0 0;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.125rem);
        line-height: 2;
      }

      @media (min-width: 640px) {
        .shell {
          padding-left: 32px;
          padding-right: 32px;
        }

        .panel-inner {
          padding: 40px;
        }

        .brand {
          width: 256px;
        }
      }

      @media (min-width: 1024px) {
        .shell {
          padding-left: 48px;
          padding-right: 48px;
        }

        .panel-inner {
          padding: 56px;
        }
      }

      @media (max-width: 639px) {
        .shell {
          padding: 16px;
        }

        .panel {
          border-radius: 20px;
        }
      }
    </style>
  </head>
